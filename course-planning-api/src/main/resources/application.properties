#Application Name
spring.application.name=course-planning-api

#Profile Environment
spring.profiles.active=dev

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:sqlite:../maplewood_school.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration (allow frontend to connect)
# You'll need to configure CORS in your code or add this:
# spring.web.cors.allowed-origins=http://localhost:3000
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
# spring.web.cors.allowed-headers=*

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.maplewood=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


#Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=Maplewood Course Planning API
info.app.description=This backend is a center of truth for course planning application
info.app.version=1.0.0

#devtools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

#general
spring.jackson.serialization.write-dates-as-timestamps=false
